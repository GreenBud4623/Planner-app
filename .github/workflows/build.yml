name: Build apps

# On every push: builds a signed Planner.apk (Android) and Planner-Setup.exe / Planner-Portable.exe
# (Windows), then publishes them together on the Releases page.
on:
  push:
    paths:
      - "www/**"
      - "android/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEY secret yet, so the APK was not built. See README › Automatic builds."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the web app into Android
        if: steps.key.outputs.present == 'true'
        run: |
          npm ci
          npm run sync

      - name: Restore the signing key
        if: steps.key.outputs.present == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d | tar -xz -C android

      - name: Build signed APK
        if: steps.key.outputs.present == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Planner.apk
          rm -f keystore.properties planner-release.jks

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: Planner-apk
          path: Planner.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: Planner-windows
          path: |
            desktop/dist/Planner-Setup.exe
            desktop/dist/Planner-Portable.exe

  release:
    needs: [apk, windows]
    if: always() && (needs.apk.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Only describe the files this build actually produced (the APK needs the SIGNING_KEY secret)
      - name: Write release notes
        run: |
          {
            if [ -f out/Planner.apk ]; then
              echo "**Android:** download **Planner.apk** on your phone and tap it to install. It installs over the previous version and keeps your tasks."
              echo
            fi
            if [ -f out/Planner-Setup.exe ]; then
              echo "**Windows PC:** download **Planner-Setup.exe** and run it (or **Planner-Portable.exe** to run it without installing). If Windows shows \"Windows protected your PC\", click **More info → Run anyway**. Updating installs over the old version and keeps your tasks."
            fi
          } > notes.md
          cat notes.md
          if [ ! -f out/Planner.apk ]; then
            echo "::warning::This release has no Android APK because the SIGNING_KEY secret is missing. See README › Automatic builds."
          fi

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Planner (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: notes.md
          files: out/*
